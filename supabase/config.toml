project_id = "airsense"

[auth]
enabled = true
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 900

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.ingest-reading]
verify_jwt = false

[functions.send-reading-email]
verify_jwt = true

[functions.send-quote-email]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

[functions.environment-recommendations]
verify_jwt = true
